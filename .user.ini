; PHP settings for this site (PHP 8, read by PHP-FPM / CGI on cPanel hosting).
; Replaces the old full php.ini copy, which held PHP 5-era directives that PHP 8 rejects.
; Blocked from the web by .htaccess.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = error_log

memory_limit = 128M
max_execution_time = 30
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 16M
file_uploads = On

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1

date.timezone = Asia/Colombo
